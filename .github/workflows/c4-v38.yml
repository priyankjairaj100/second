name: One-use free C4 V38

on:
  push:
    branches: [main]
    paths: ['.github/ci/c4-v38-trigger.json']

permissions:
  contents: write

concurrency:
  group: one-use-c4-v38
  cancel-in-progress: false

jobs:
  c4:
    if: >-
      github.repository == 'priyankjairaj100/second' &&
      github.event.repository.private == false &&
      github.event_name == 'push' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Read full published history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Publish durable one-use claim
        id: claim
        run: python3 scripts/execute_ci_c4_v38.py claim
      - name: Select CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Install pinned numerical dependencies without cache
        run: python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r requirements-ci-v38.txt
      - name: Verify bounded software fixtures on the actual host
        run: python scripts/execute_ci_c4_v38.py fixtures
      - name: Register, publish, run, and audit the C4 campaign
        run: python scripts/execute_ci_c4_v38.py execute
      - name: Preserve final state after success or failure
        if: always() && steps.claim.outcome == 'success'
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: python3 scripts/execute_ci_c4_v38.py finalize
